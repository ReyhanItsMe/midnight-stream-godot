name: Build Midnight Stream APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi

          echo "Using: $SDKMANAGER"

          "$SDKMANAGER" --version

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --licenses || true

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "platform-tools" "build-tools;34.0.0"

      - name: Download Godot
        run: |
          wget -q \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            -O godot.zip

          unzip -q godot.zip

          mv Godot_v4.7.2-stable_linux.x86_64 godot

          chmod +x godot

          ./godot --version

      - name: Download Export Templates
        run: |
          wget -q \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz" \
            -O templates.tpz

          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"

          unzip -q templates.tpz \
            -d "$HOME/.local/share/godot/export_templates/4.7.2.stable"

      - name: Fix Export Templates
        run: |
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.7.2.stable"

          if [ -d "$TEMPLATE_DIR/templates" ]; then
            mv "$TEMPLATE_DIR/templates/"* "$TEMPLATE_DIR/"
            rmdir "$TEMPLATE_DIR/templates"
          fi

          echo "Templates:"
          find "$TEMPLATE_DIR" -maxdepth 1 -type f -print

          test -f "$TEMPLATE_DIR/android_debug.apk"
          test -f "$TEMPLATE_DIR/android_release.apk"

      - name: Check Project
        run: |
          test -f project.godot
          test -f export_presets.cfg

          echo "project.godot OK"
          echo "export_presets.cfg OK"

      - name: Import Project
        run: |
          ./godot \
            --headless \
            --path . \
            --editor \
            --quit

      - name: Export & Sign Android APK (Release)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          mkdir -p build

          # 1. Decode keystore sebelum Godot melakukan export
          echo "$KEYSTORE_BASE64" | tr -d '[:space:]%' | base64 -d > "$GODOT_ANDROID_KEYSTORE_RELEASE_PATH"

          # 2. Export & Sign otomatis oleh Godot
          ./godot \
            --headless \
            --path . \
            --export-release "Android" \
            build/MidnightStream.apk

          # 3. Hapus file keystore setelah selesai
          rm -f "$GODOT_ANDROID_KEYSTORE_RELEASE_PATH"

      - name: Verify & Check APK
        run: |
          test -f build/MidnightStream.apk

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose build/MidnightStream.apk

          echo "Signed APK successfully created:"
          ls -lh build/MidnightStream.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MidnightStream-APK
          path: build/MidnightStream.apk
          if-no-files-found: error
