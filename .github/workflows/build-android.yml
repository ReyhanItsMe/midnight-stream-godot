name: Build Midnight Stream APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'

      - name: Setup Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f \
            -name sdkmanager \
            | head -n 1)"

          echo "Android SDK: $ANDROID_HOME"
          echo "SDK Manager: $SDKMANAGER"

          "$SDKMANAGER" --version

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --licenses || true

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "platform-tools"

      - name: Download Godot
        run: |
          wget -q \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip \
            -O godot.zip

          unzip -q godot.zip

          mv Godot_v4.7.2-stable_linux.x86_64 godot

          chmod +x godot

      - name: Download Godot Export Templates
        run: |
          wget -q \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz \
            -O templates.tpz

          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable

          unzip -q templates.tpz \
            -d ~/.local/share/godot/export_templates/4.7.2.stable

      - name: Check Godot
        run: |
          ./godot --version

      - name: Export Android APK
        run: |
          mkdir -p build

          ./godot \
            --headless \
            --path . \
            --export-debug "Android" \
            build/MidnightStream.apk

      - name: Upload Midnight Stream APK
        uses: actions/upload-artifact@v4
        with:
          name: MidnightStream-APK
          path: build/MidnightStream.apk